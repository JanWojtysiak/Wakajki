services:
  backend:
    build: .
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      DATABASE_URL: postgresql://wakajki:wakajki@postgres:5432/wakajki
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm run prisma:emit && npm run db:update -- -y && npm run start:dev"
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - '127.0.0.1:5173:5173'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
  postgres:
    image: postgres:18.6-alpine3.24
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wakajki
      POSTGRES_PASSWORD: wakajki
      POSTGRES_DB: wakajki
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wakajki -d wakajki']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
